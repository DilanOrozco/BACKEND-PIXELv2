sonar.projectKey=pixel-backend
sonar.projectName=Pixel Backend
sonar.projectVersion=1.0

# Analizar todo el código dentro de la carpeta actual
sonar.sources=.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts

# Carpetas que SonarQube no debe analizar
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,src/**/*.test.ts

# Cobertura real generada por el test runner nativo de Node para JavaScript y TypeScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

# Artefactos sin lógica de negocio ejecutable dentro del proceso HTTP
sonar.coverage.exclusions=src/app.ts,prisma.config.ts,prisma/migrations/**,generated/**

sonar.sourceEncoding=UTF-8
